name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk membuat GitHub Release saat push tag

env:
  # Opsional: isi secrets di Settings > Secrets and variables > Actions
  # untuk menghasilkan APK release yang ditandatangani.
  KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASS: ${{ secrets.KEY_PASSWORD }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Generate icons & splash
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Apply native tweaks (landscape + fullscreen)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          STYLES=android/app/src/main/res/values/styles.xml

          # Kunci orientasi landscape (bisa dibalik kiri/kanan)
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' "$MANIFEST"

          # Pakai area notch/cutout, tema fullscreen
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' "$STYLES"

          # Immersive mode
          cp android-overrides/MainActivity.java android/app/src/main/java/com/feynjf/daxia/MainActivity.java


      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK (jika keystore ada)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          set -e
          ./gradlew assembleRelease --no-daemon
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -v -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out app/build/outputs/apk/release/WorldOfDaxia-release.apk \
            "$RUNNER_TEMP/aligned.apk"

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/WorldOfDaxia-debug.apk
          if [ -f android/app/build/outputs/apk/release/WorldOfDaxia-release.apk ]; then
            cp android/app/build/outputs/apk/release/WorldOfDaxia-release.apk dist/
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfDaxia-apk
          path: dist/*.apk

      - name: Publish GitHub Release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          
